<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>BOND & PROSPER</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0f7a55">
<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#14231c;--mu:#66756e;--ac:#0f7a55;--ac2:#e3f3ec;--bd:#dde4e0;--rd:#c0392b;--rd2:#fbe9e7}
@media(prefers-color-scheme:dark){:root{--bg:#0f1713;--card:#18231d;--tx:#e8f0ec;--mu:#8fa299;--ac:#3fbf8f;--ac2:#1d3a2d;--bd:#2a3a32;--rd:#ff8a7a;--rd2:#3a1f1b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:70px}
header{background:var(--ac);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}header b{font-size:17px}#who{font-size:12px;text-align:right}
main{max-width:760px;margin:0 auto;padding:12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat small{color:var(--mu);display:block}.stat b{font-size:20px}h2{font-size:17px;margin:4px 0 10px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd);cursor:pointer}.row:first-of-type{border-top:0}.grow{flex:1;min-width:0}.grow small{color:var(--mu);display:block}
.av{width:40px;height:40px;border-radius:50%;background:var(--ac2);color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;font-weight:600}.paid{background:var(--ac2);color:var(--ac)}.due{background:var(--rd2);color:var(--rd)}
input,select,button.b{font:inherit;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);width:100%;margin-bottom:8px}
button.b{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer}button.b.g{background:#555}button.b.r{background:var(--rd)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex}nav button{flex:1;border:0;background:none;padding:12px 2px;color:var(--mu);font-size:12px}nav button.on{color:var(--ac);font-weight:700}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:9}.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;max-height:85vh;overflow:auto}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd);gap:10px}.kv span:first-child{color:var(--mu)}.err{color:var(--rd);font-size:13px;margin-bottom:6px}
</style></head><body>
<header><b>BOND &amp; PROSPER</b><span id="who"></span></header>
<main id="app"></main><nav id="nav"></nav>
<div class="modal" id="md" onclick="if(event.target===this)hide()"><div class="sheet" id="sh"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
/* ====== PASTE YOUR TWO VALUES HERE (Supabase > Project Settings > API) ====== */
const SUPABASE_URL="https://qpltdntlbjttgcshnyzn.supabase.co";
const SUPABASE_KEY="sb_publishable_hsCPUeyEPoShuOZeHB7k7g_T97Rm1uk";
/* ============================================================================= */
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>"\u09F3"+Number(n||0).toLocaleString("en-IN");
const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-01";
const now=new Date(),CUR=iso(now);
const MONTHS=Array.from({length:36},(_,i)=>iso(new Date(now.getFullYear(),now.getMonth()-i,1)));
const ml=k=>MN[+k.slice(5,7)-1]+" "+k.slice(0,4);
const ini=n=>String(n||"?").split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase();
const METH={bkash:"bKash",nagad:"Nagad",bank_transfer:"Bank transfer",cash:"Cash",other:"Other"};
const RN={member:"Member",admin:"Admin",super_admin:"Super Admin"};
let uid=null,me=null,P=[],S={},TT={},F={},PAYC=[],PAYM=[],tab="dash",q="",pm=CUR,idle,tm,lastPr=null;
const isA=()=>me&&me.role!=="member";
const hide=()=>$("md").classList.remove("show");
const sh=h=>{$("sh").innerHTML=h;$("md").classList.add("show")};
const fail=e=>alert("Error: "+(e&&e.message||e));

function showLogin(){uid=null;me=null;$("nav").innerHTML="";$("who").textContent="";hide();
$("app").innerHTML=`<div class="card" style="margin-top:30px"><h2>Log in</h2><input id="lu" placeholder="User ID (example: M001)" autocapitalize="off" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button class="b" onclick="login()">Log in</button><div id="le" class="err"></div></div>`}
async function login(){const u=$("lu").value.trim().toLowerCase();if(!u)return;
const{data,error}=await sb.auth.signInWithPassword({email:u.includes("@")?u:u+"@bondandprosper.app",password:$("lp").value});
if(error){$("le").textContent="Wrong user ID or password.";return}uid=data.user.id;start()}
async function out(){clearTimeout(idle);await sb.auth.signOut();showLogin()}
function bump(){clearTimeout(idle);idle=setTimeout(out,900000)}
document.addEventListener("click",()=>{if(uid)bump()});

async function start(){await load();if(!me||me.status!=="active"){await out();return}
$("who").innerHTML=esc(me.full_name)+"<br>"+RN[me.role];bump();
const ch=sb.channel("live");["payments","settings","profiles"].forEach(t=>ch.on("postgres_changes",{event:"*",schema:"public",table:t},sched));ch.subscribe()}
function sched(){clearTimeout(tm);tm=setTimeout(async()=>{await load();draw()},400)}
async function load(){
const r=await Promise.all([sb.from("profiles").select("*").order("member_no"),sb.from("settings").select("*").single(),sb.from("member_totals").select("*"),sb.from("fund_summary").select("*").single(),sb.from("payments").select("member_id").eq("for_month",CUR),sb.from("payments").select("*").eq("for_month",pm)]);
const e=r.find(x=>x.error);if(e){fail(e.error);return}
P=r[0].data;S=r[1].data;TT=Object.fromEntries(r[2].data.map(x=>[x.member_id,x]));F=r[3].data;PAYC=r[4].data;PAYM=r[5].data;
me=P.find(x=>x.id===uid);if(me)draw()}

function draw(){if(!me)return;
$("nav").innerHTML=[["dash","Home"],["mem","Members"],["pay","Payments"],["acc","Account"]].map(x=>`<button class="${tab===x[0]?"on":""}" onclick="tab='${x[0]}';draw()">${x[1]}</button>`).join("");
$("app").innerHTML={dash,mem,pay,acc}[tab]();window.scrollTo(0,0)}

function dash(){const act=P.filter(m=>m.status==="active"),ids=new Set(PAYC.map(x=>x.member_id)),paid=act.filter(m=>ids.has(m.id)).length;
return `<div class="grid"><div class="card stat"><small>Total fund</small><b>${fmt(F.total_fund)}</b></div><div class="card stat"><small>Total members</small><b>${F.active_members}</b></div>
<div class="card stat"><small>${ml(CUR)} paid</small><b>${paid}</b></div><div class="card stat"><small>${ml(CUR)} due</small><b>${act.length-paid}</b></div></div>
<div class="card"><h2>Monthly instalment</h2><b style="font-size:22px">${fmt(S.installment_amount)}</b> per member</div>
<div class="card"><h2>Send money to</h2>${[["Bank",S.bank_name],["Account no.",S.account_no],["Holder",S.account_holder],["Branch",S.branch],["Mobile banking",S.mobile_banking]].map(x=>`<div class="kv"><span>${x[0]}</span><b>${esc(x[1]||"-")}</b></div>`).join("")}
${isA()?`<button class="b" style="margin-top:10px" onclick="editS()">Edit instalment and payment details</button>`:""}</div>`}
const SF=[["installment_amount","Monthly instalment (number)"],["bank_name","Bank name"],["account_no","Account number"],["account_holder","Account holder"],["branch","Branch"],["mobile_banking","Mobile banking number"]];
function editS(){sh(`<h2>Edit payment details</h2>${SF.map(f=>`<small style="color:var(--mu)">${f[1]}</small><input id="s_${f[0]}" value="${esc(S[f[0]])}">`).join("")}<button class="b" onclick="saveS()">Save</button>`)}
async function saveS(){const o={updated_at:new Date().toISOString()};SF.forEach(f=>o[f[0]]=$("s_"+f[0]).value.trim());o.installment_amount=Number(o.installment_amount);
if(!(o.installment_amount>0)){alert("Instalment must be a number above 0");return}
const{error}=await sb.from("settings").update(o).eq("id",1);if(error)return fail(error);hide();await load()}

function mem(){const l=P.filter(m=>m.status==="active"&&m.full_name.toLowerCase().includes(q.toLowerCase()));
return `<input placeholder="Search members" value="${esc(q)}" oninput="q=this.value;$('ml').innerHTML=rows()"><div class="card" id="ml">${rows()}</div>`}
function rows(){const l=P.filter(m=>m.status==="active"&&m.full_name.toLowerCase().includes(q.toLowerCase()));
return l.map(m=>{const t=TT[m.id]||{};return `<div class="row" onclick="prof('${m.id}')"><div class="av">${ini(m.full_name)}</div><div class="grow">${esc(m.full_name)}<small>${esc(m.phone||"")}</small></div><div style="text-align:right"><b>${fmt(t.total_saved)}</b><small style="color:var(--mu)">${Number(t.share_percent||0).toFixed(2)}%</small></div></div>`}).join("")||"No match"}
async function prof(id){const m=P.find(x=>x.id===id),t=TT[id]||{};lastPr=null;
if(isA()||id===uid){const r=await sb.from("profiles_private").select("*").eq("id",id).single();lastPr=r.data}
let h=`<div style="text-align:center"><div class="av" style="width:72px;height:72px;margin:0 auto 8px;font-size:24px">${ini(m.full_name)}</div><b style="font-size:18px">${esc(m.full_name)}</b><br><small style="color:var(--mu)">User ID: M${String(m.member_no).padStart(3,"0")}</small></div><div style="margin-top:10px">
<div class="kv"><span>Contact</span><b>${esc(m.phone||"-")}</b></div><div class="kv"><span>Total saving</span><b>${fmt(t.total_saved)}</b></div><div class="kv"><span>Share of fund</span><b>${Number(t.share_percent||0).toFixed(2)}%</b></div>`;
if(lastPr)h+=PF.map(f=>`<div class="kv"><span>${f[1]}</span><b>${esc(lastPr[f[0]]||"-")}</b></div>`).join("");
if(isA())h+=`<button class="b" style="margin-top:10px" onclick="editM('${id}')">Edit profile</button>`;
sh(h+"</div>")}
const PF=[["dob","Date of birth"],["nid","NID number"],["father_name","Father\u2019s name"],["mother_name","Mother\u2019s name"],["nominee_name","Nominee name"]];
function editM(id){const m=P.find(x=>x.id===id),p=lastPr||{};
sh(`<h2>Edit member</h2><small style="color:var(--mu)">Full name</small><input id="e_full_name" value="${esc(m.full_name)}"><small style="color:var(--mu)">Contact no.</small><input id="e_phone" value="${esc(m.phone||"")}">${PF.map(f=>`<small style="color:var(--mu)">${f[1]}</small><input id="e_${f[0]}" ${f[0]==="dob"?'type="date"':""} value="${esc(p[f[0]]||"")}">`).join("")}<button class="b" onclick="saveM('${id}')">Save changes</button>`)}
async function saveM(id){const v=k=>$("e_"+k).value.trim()||null;
if(!v("full_name")){alert("Name is required");return}
const a=await sb.from("profiles").update({full_name:v("full_name"),phone:v("phone")}).eq("id",id);if(a.error)return fail(a.error);
const o={};PF.forEach(f=>o[f[0]]=v(f[0]));const b=await sb.from("profiles_private").update(o).eq("id",id);if(b.error)return fail(b.error);hide();await load()}

function pay(){const ids=new Map(PAYM.map(x=>[x.member_id,x])),act=P.filter(m=>m.status==="active"),c=act.filter(m=>ids.has(m.id)).length;
return `<select onchange="setPm(this.value)">${MONTHS.map(k=>`<option value="${k}" ${k===pm?"selected":""}>${ml(k)}</option>`).join("")}</select>${isA()?`<button class="b" onclick="addP()">+ Record a payment</button>`:""}
<div class="card"><h2>${ml(pm)}: ${c} paid, ${act.length-c} due</h2>${act.map(m=>{const r=ids.get(m.id);return `<div class="row" onclick="prof('${m.id}')"><div class="av">${ini(m.full_name)}</div><div class="grow">${esc(m.full_name)}<small>${r?r.paid_on+" \u00b7 "+(METH[r.method]||r.method)+" \u00b7 "+fmt(r.amount):"Not paid yet"}</small></div><span class="tag ${r?"paid":"due"}">${r?"Paid":"Due"}</span></div>`}).join("")}</div>`}
async function setPm(v){pm=v;const r=await sb.from("payments").select("*").eq("for_month",pm);if(r.error)return fail(r.error);PAYM=r.data;draw()}
function addP(){sh(`<h2>Record payment</h2><select id="p1">${P.filter(m=>m.status==="active").map(m=>`<option value="${m.id}">${esc(m.full_name)}</option>`).join("")}</select><select id="p2">${MONTHS.map(k=>`<option value="${k}" ${k===pm?"selected":""}>${ml(k)}</option>`).join("")}</select><input id="p3" type="number" value="${S.installment_amount}"><input id="p4" type="date" value="${new Date().toISOString().slice(0,10)}"><select id="p5">${Object.entries(METH).map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("")}</select><button class="b" onclick="saveP()">Save payment</button>`)}
async function saveP(){const o={member_id:$("p1").value,for_month:$("p2").value,amount:Number($("p3").value),paid_on:$("p4").value,method:$("p5").value};
if(!(o.amount>0)||!o.paid_on){alert("Enter amount and date");return}
const{error}=await sb.from("payments").insert(o);if(error)return fail(error);hide();await load()}

function acc(){return `<div class="card"><h2>${esc(me.full_name)}</h2><div class="kv"><span>Role</span><b>${RN[me.role]}</b></div><div class="kv"><span>Contact</span><b>${esc(me.phone||"-")}</b></div></div>
<div class="card"><h2>Change password</h2><input id="n1" type="password" placeholder="New password (min 8 characters)" autocomplete="new-password"><input id="n2" type="password" placeholder="Repeat new password" autocomplete="new-password"><div id="ne" class="err"></div><button class="b" onclick="chPw()">Save password</button></div>
<button class="b g" onclick="out()">Log out</button>`}
async function chPw(){const a=$("n1").value;if(a.length<8){$("ne").textContent="Use at least 8 characters.";return}if(a!==$("n2").value){$("ne").textContent="The two passwords do not match.";return}
const{error}=await sb.auth.updateUser({password:a});if(error)return fail(error);$("n1").value=$("n2").value="";$("ne").textContent="";alert("Password changed.")}

if(SUPABASE_URL.startsWith("PASTE")){$("app").innerHTML='<div class="card">Setup needed: open this file and paste your Supabase Project URL and anon key at the top.</div>'}
else sb.auth.getSession().then(({data})=>{if(data.session){uid=data.session.user.id;start()}else showLogin()});
</script></body></html>
